name: docmind-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docmind} -d ${POSTGRES_DB:-docmind}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: DocMind-Agent
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: INFO
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-docmind}:${POSTGRES_PASSWORD:-docmind}@postgres:5432/${POSTGRES_DB:-docmind}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_API_KEY: EMPTY
      LLM_MODEL: Qwen/Qwen3-0.6B
      UPLOAD_DIR: /app/data/uploads
      EMBEDDING_CACHE_DIR: /app/data/embed_cache
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_VECTOR_SIZE: '512'
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RAG_CANDIDATE_K: '8'
      RAG_EVIDENCE_K: '2'
      RAG_MAX_EVIDENCE_CHARS: '160'
      RAG_MAX_ANSWER_TOKENS: '128'
      MAX_UPLOAD_BYTES: '10485760'
      # Optional runtime proxy for downloads from inside the Linux container.
      # Docker Desktop's host.docker.internal refers to the Windows host.
      HTTP_PROXY: ${DOCMIND_PROXY_URL:-}
      HTTPS_PROXY: ${DOCMIND_PROXY_URL:-}
      ALL_PROXY: ${DOCMIND_PROXY_URL:-}
      NO_PROXY: "localhost,127.0.0.1,postgres,redis,qdrant,api,host.docker.internal,modelscope.cn,.modelscope.cn,.aliyuncs.com"
    volumes:
      - documents-data:/app/data/uploads
      - embedding-cache:/app/data/embed_cache
    ports:
      - "8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  documents-data:
  embedding-cache:
